name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra tests

      - name: Run milestone 1 tests
        run: uv run python -m testrunner local "python -m cli" tests/milestone1/base

      - name: Run milestone 2 tests
        run: uv run python -m testrunner local "python -m cli" tests/milestone2/base

      - name: Run milestone 3 tests
        run: uv run python -m testrunner local "python -m cli" tests/milestone3/base