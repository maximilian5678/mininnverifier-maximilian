name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout including the testrunner submodule and the LFS test data.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      # Install uv (and let it manage the Python 3.14 toolchain).
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Resolve and install dependencies from uv.lock, including the
      # "tests" extra which pulls in the testrunner path dependency.
      - name: Install dependencies
        run: uv sync --frozen --extra tests

      # Run the tests via the project's own testrunner.
      # Pattern: testrunner local "<cli command>" <test directory>
      - name: Run milestone 1 tests
        run: uv run python -m testrunner local "python -m cli" tests/milestone1/base

      - name: Run milestone 2 tests
        run: uv run python -m testrunner local "python -m cli" tests/milestone2/base